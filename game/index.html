<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔子上學去｜聽客語點圖</title>
<meta name="description" content="給四到六歲幼兒的聽客語點圖小遊戲：老師用客語唸，孩子點出對的圖卡。無計時、無分數、無聲音。">
<style>
:root{
  --bg:#FFF8EC; --ink:#3A4A5C; --muted:#8A97A6; --navy:#0B1F3A; --green:#2E7D5B;
  --c1:#FDE2E4; --c2:#E2F0CB; --c3:#DCEBFA; --c4:#FFF1C1; --c5:#EADCF8; --c6:#D7F2EC;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  font-size:18px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column}
/* 老師提示列：小、灰，給老師看 */
.cue{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:12px;padding:8px 12px;
  color:var(--muted);font-size:14px;line-height:1.4;background:rgba(255,255,255,.6);border-bottom:1px solid #F1E6D2}
.cue b{color:var(--ink);font-weight:700}
.cue .prog{white-space:nowrap}
.stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:2vmin;min-height:0}
.cards{display:flex;gap:3vmin;align-items:center;justify-content:center}
.card{--s:max(28vmin, min(29vw, 58vh));
  width:var(--s);height:var(--s);border:0;border-radius:calc(var(--s) * .16);cursor:pointer;
  display:flex;align-items:center;justify-content:center;position:relative;padding:0;
  font-size:calc(var(--s) * .6);line-height:1;
  font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  box-shadow:0 1.2vmin 0 rgba(58,74,92,.12), 0 2vmin 4vmin rgba(58,74,92,.10);
  transition:transform .25s ease, box-shadow .25s ease}
.card:focus-visible{outline:5px solid #9CC9E8;outline-offset:4px}
.card:active{transform:translateY(.6vmin) scale(.98)}
.card.right{transform:scale(1.12);box-shadow:0 0 0 1.4vmin #FFD66B, 0 2vmin 4vmin rgba(58,74,92,.15);z-index:2}
.card.dim{opacity:.35;transform:scale(.92)}
.card.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3vmin)}40%{transform:translateX(3vmin)}60%{transform:translateX(-2vmin)}80%{transform:translateX(2vmin)}}
.star{position:absolute;left:50%;top:50%;font-size:calc(var(--s) * .22);pointer-events:none;
  transform:translate(-50%,-50%);animation:burst .9s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  30%{opacity:1}
  100%{opacity:1;transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1)}}
.cheer{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;
  background:#fff;color:var(--green);font-weight:900;font-size:max(9vmin,40px);border-radius:999px;padding:1vmin 5vmin;
  box-shadow:0 2vmin 5vmin rgba(58,74,92,.18);transition:opacity .2s, transform .3s;z-index:5;white-space:nowrap}
.cheer.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* 完成畫面 */
.done{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;
  background:var(--bg);z-index:6;text-align:center;padding:16px}
.done.show{display:flex}
.done .big{font-size:22vmin;line-height:1;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.done h1{margin:0;font-size:max(7vmin,30px);color:var(--green);line-height:1.3}
.again{appearance:none;border:0;border-radius:999px;background:#7CC4A4;color:#fff;font:inherit;font-weight:900;
  font-size:max(6vmin,28px);padding:2.4vmin 8vmin;min-height:72px;cursor:pointer;box-shadow:0 1.2vmin 0 #4E9C7A}
.again:active{transform:translateY(.6vmin);box-shadow:0 .6vmin 0 #4E9C7A}
.corner{position:fixed;right:10px;bottom:8px;font-size:14px;color:var(--muted);z-index:7;background:rgba(255,248,236,.85);
  border-radius:8px;padding:2px 8px}
.corner a{color:var(--muted)}
.corner .decl{font-size:12px}
.corner{text-align:right;max-width:calc(100vw - 20px)}
@media (orientation:portrait){
  .cards{flex-direction:column}
  .card{--s:max(28vmin, min(62vw, 25vh))}
}
@media (prefers-reduced-motion:reduce){
  .card,.cheer{transition:none}
  .card.shake{animation:none;outline:5px dashed #F2B8B5;outline-offset:4px}
  .card.right{transform:none}
  .star{animation:none;transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))}
}
</style>
</head>
<body>
<div class="app">
  <div class="cue" aria-live="polite">
    <span id="cue">老師請用客語說：<b>兔子</b></span>
    <span class="prog" id="prog">第 1／6 題</span>
  </div>
  <main class="stage">
    <div class="cards" id="cards"></div>
  </main>
</div>
<div class="cheer" id="cheer" aria-hidden="true">⭐ 好棒！</div>
<div class="done" id="done" role="dialog" aria-label="全部完成">
  <div class="big">🐰⭐</div>
  <h1>全部完成，你好棒！</h1>
  <button class="again" id="again" type="button">再玩一次</button>
</div>
<div class="corner">AI 生成，教師審核｜客語由老師唸｜<a href="../index.html">回學生版</a><br><span class="decl">本文為原創文章，原始碼以 MIT License 公開；程式由 Claude Code 協作撰寫，內容由作者負責。</span></div>

<script>
(function () {
  var ITEMS = [
    { e: '🐰', zh: '兔子' },
    { e: '🏠', zh: '房子' },
    { e: '🌾', zh: '稻田' },
    { e: '🚂', zh: '火車' },
    { e: '🏫', zh: '學校' },
    { e: '☀️', zh: '太陽' }
  ];
  var COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)'];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var cardsEl = document.getElementById('cards');
  var cueEl = document.getElementById('cue');
  var progEl = document.getElementById('prog');
  var cheerEl = document.getElementById('cheer');
  var doneEl = document.getElementById('done');
  var againEl = document.getElementById('again');

  var order = [], idx = 0, busy = false;

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function start() {
    order = shuffle(ITEMS.map(function (_, i) { return i; }));
    idx = 0;
    doneEl.classList.remove('show');
    ask();
  }

  function ask() {
    busy = false;
    var target = order[idx];
    var others = shuffle(ITEMS.map(function (_, i) { return i; }).filter(function (i) { return i !== target; })).slice(0, 2);
    var choices = shuffle([target].concat(others));
    cueEl.innerHTML = '老師請用客語說：<b>' + ITEMS[target].zh + '</b>';
    progEl.textContent = '第 ' + (idx + 1) + '／' + ITEMS.length + ' 題';
    cardsEl.innerHTML = '';
    choices.forEach(function (i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'card';
      b.style.background = COLORS[i];
      b.textContent = ITEMS[i].e;
      b.setAttribute('aria-label', ITEMS[i].zh);
      b.addEventListener('click', function () { pick(b, i === target); });
      cardsEl.appendChild(b);
    });
  }

  function stars(card) {
    var n = 6;
    for (var k = 0; k < n; k++) {
      var s = document.createElement('span');
      s.className = 'star';
      s.textContent = '⭐';
      var ang = (Math.PI * 2 * k) / n - Math.PI / 2;
      s.style.setProperty('--dx', 'calc(var(--s) * ' + (Math.cos(ang) * 0.48).toFixed(2) + ')');
      s.style.setProperty('--dy', 'calc(var(--s) * ' + (Math.sin(ang) * 0.48).toFixed(2) + ')');
      card.appendChild(s);
    }
  }

  function pick(card, ok) {
    if (busy) return;
    if (!ok) {
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      setTimeout(function () { card.classList.remove('shake'); }, 600);
      return;
    }
    busy = true;
    Array.prototype.forEach.call(cardsEl.children, function (c) {
      if (c !== card) c.classList.add('dim');
    });
    card.classList.add('right');
    stars(card);
    cheerEl.classList.add('show');
    setTimeout(function () {
      cheerEl.classList.remove('show');
      idx++;
      if (idx >= ITEMS.length) {
        doneEl.classList.add('show');
        againEl.focus();
      } else {
        ask();
      }
    }, reduce ? 1200 : 1600);
  }

  againEl.addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
